<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">stage ambient background</title>
  <desc id="desc">Soft futuristic stage background with grid, light beams, and a curved platform.</desc>
