<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">蓝色数据图表渲染结果</title>
  <desc id="desc">包含趋势线、柱状图和关键指标卡片的可视化结果示意。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5fbff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="960" height="640" rx="36" fill="url(#bg)"/>
  <circle cx="160" cy="120" r="120" fill="#38bdf8" opacity=".16"/>
  <circle cx="780" cy="100" r="170" fill="#2563eb" opacity=".12"/>
  <g filter="url(#shadow)">
    <rect x="70" y="70" width="820" height="500" rx="28" fill="#ffffff" opacity=".92"/>
    <rect x="100" y="105" width="210" height="86" rx="18" fill="#eff6ff"/>
    <rect x="335" y="105" width="210" height="86" rx="18" fill="#eff6ff"/>
    <rect x="570" y="105" width="210" height="86" rx="18" fill="#eff6ff"/>
    <text x="126" y="139" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19" fill="#1e40af" font-weight="700">完成率</text>
    <text x="126" y="172" font-family="Arial, sans-serif" font-size="30" fill="#0f172a" font-weight="800">92%</text>
    <text x="361" y="139" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19" fill="#1e40af" font-weight="700">核心指标</text>
    <text x="361" y="172" font-family="Arial, sans-serif" font-size="30" fill="#0f172a" font-weight="800">18.6k</text>
    <text x="596" y="139" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19" fill="#1e40af" font-weight="700">风险项</text>
    <text x="596" y="172" font-family="Arial, sans-serif" font-size="30" fill="#0f172a" font-weight="800">3</text>
    <line x1="126" y1="500" x2="780" y2="500" stroke="#bfdbfe" stroke-width="3"/>
    <line x1="126" y1="245" x2="126" y2="500" stroke="#bfdbfe" stroke-width="3"/>
    <g opacity=".55" stroke="#dbeafe" stroke-width="2">
      <line x1="126" y1="440" x2="780" y2="440"/>
      <line x1="126" y1="380" x2="780" y2="380"/>
      <line x1="126" y1="320" x2="780" y2="320"/>
      <line x1="126" y1="260" x2="780" y2="260"/>
    </g>
    <g fill="url(#bar)">
      <rect x="170" y="382" width="56" height="118" rx="12"/>
      <rect x="270" y="332" width="56" height="168" rx="12"/>
      <rect x="370" y="358" width="56" height="142" rx="12"/>
      <rect x="470" y="286" width="56" height="214" rx="12"/>
      <rect x="570" y="310" width="56" height="190" rx="12"/>
      <rect x="670" y="264" width="56" height="236" rx="12"/>
    </g>
    <polyline points="198,370 298,306 398,330 498,250 598,282 698,224" fill="none" stroke="#0f766e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#ffffff" stroke="#0f766e" stroke-width="5">
      <circle cx="198" cy="370" r="10"/>
      <circle cx="298" cy="306" r="10"/>
      <circle cx="398" cy="330" r="10"/>
      <circle cx="498" cy="250" r="10"/>
      <circle cx="598" cy="282" r="10"/>
      <circle cx="698" cy="224" r="10"/>
    </g>
  </g>
</svg>
